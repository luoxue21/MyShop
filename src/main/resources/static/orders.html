<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 - 电商系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #f5f5f5; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 0; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; padding: 0 20px; }
        .logo { font-size: 24px; font-weight: bold; }
        .nav-menu { display: flex; gap: 30px; list-style: none; }
        .nav-menu a { color: white; text-decoration: none; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .order-list { margin-top: 20px; }
        .order-item { background: white; padding: 20px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .order-header { display: flex; justify-content: space-between; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .order-status { padding: 5px 15px; border-radius: 15px; font-size: 12px; }
        .status-0 { background: #fff3e0; color: #f57c00; }
        .status-1 { background: #e3f2fd; color: #1976d2; }
        .status-2 { background: #f3e5f5; color: #7b1fa2; }
        .status-3 { background: #e8f5e9; color: #388e3c; }
        .status-4 { background: #ffebee; color: #d32f2f; }
        .order-actions { margin-top: 15px; }
        .btn { padding: 8px 20px; border: none; border-radius: 5px; cursor: pointer; margin-right: 10px; }
        .btn-pay { background: #f44336; color: white; }
        .btn-cancel { background: #9e9e9e; color: white; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">电商平台</div>
            <ul class="nav-menu">
                <li><a href="index.html">首页</a></li>
                <li><a href="products.html">商品列表</a></li>
                <li><a href="orders.html">我的订单</a></li>
            </ul>
        </div>
    </nav>
    
    <div class="container">
        <h1>我的订单</h1>
        <div class="order-list" id="orderList"></div>
    </div>
    
    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) { window.location.href = 'login.html'; }
        
        const statusMap = {0: '待支付', 1: '已支付', 2: '已发货', 3: '已完成', 4: '已取消'};
        
        function loadOrders() {
            fetch(`http://localhost:8081/api/order/user/${currentUser.userId}`)
                .then(r => r.json())
                .then(data => {
                    if (data.code === 200) {
                        document.getElementById('orderList').innerHTML = data.data.map(order => `
                            <div class="order-item">
                                <div class="order-header">
                                    <div>
                                        <div><strong>订单号：</strong>${order.orderNo}</div>
                                        <div><strong>下单时间：</strong>${new Date(order.createTime).toLocaleString()}</div>
                                    </div>
                                    <span class="order-status status-${order.orderStatus}">${statusMap[order.orderStatus]}</span>
                                </div>
                                <div>
                                    <div><strong>收货人：</strong>${order.receiverName}</div>
                                    <div><strong>电话：</strong>${order.receiverPhone}</div>
                                    <div><strong>地址：</strong>${order.receiverAddress}</div>
                                    <div style="margin-top:10px;"><strong>订单金额：</strong><span style="color:#f44336;font-size:20px;">¥${order.totalAmount}</span></div>
                                </div>
                                <div class="order-actions">
                                    ${order.orderStatus === 0 ? `
                                        <button class="btn btn-pay" onclick="payOrder(${order.orderId})">去支付</button>
                                        <button class="btn btn-cancel" onclick="cancelOrder(${order.orderId})">取消订单</button>
                                    ` : ''}
                                </div>
                            </div>
                        `).join('');
                    }
                });
        }
        
        function payOrder(orderId) {
            const paymentData = {
                orderId: orderId,
                paymentMethod: 1,
                paymentAmount: 0,
                paymentStatus: 1,
                paymentTime: new Date().toISOString()
            };
            
            fetch('http://localhost:8081/api/payment/create', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(paymentData)
            })
            .then(() => {
                return fetch(`http://localhost:8081/api/order/update`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({orderId: orderId, orderStatus: 1})
                });
            })
            .then(() => {
                alert('支付成功！');
                loadOrders();
            });
        }
        
        function cancelOrder(orderId) {
            if (!confirm('确定要取消该订单吗？')) return;
            
            fetch(`http://localhost:8081/api/order/cancel/${orderId}`, {
                method: 'PUT'
            })
            .then(r => r.json())
            .then(data => {
                alert(data.message);
                loadOrders();
            });
        }
        
        loadOrders();
    </script>
</body>
</html>
