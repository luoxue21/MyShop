<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品列表 - 电商系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #f5f5f5; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 0; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .logo { font-size: 24px; font-weight: bold; }
        .nav-menu { display: flex; gap: 30px; list-style: none; }
        .nav-menu a { color: white; text-decoration: none; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .product-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-5px); }
        .product-image { width: 100%; height: 250px; background: #f0f0f0; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .product-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
        .product-card:hover .product-image img { transform: scale(1.05); }
        .no-image { color: #999; font-size: 14px; }
        .product-info { padding: 15px; }
        .product-name { font-size: 16px; font-weight: bold; margin-bottom: 10px; }
        .product-price { color: #f44336; font-size: 20px; font-weight: bold; }
        .btn-buy { width: 100%; padding: 10px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">电商平台</div>
            <ul class="nav-menu">
                <li><a href="index.html">首页</a></li>
                <li><a href="products.html">商品列表</a></li>
                <li><a href="cart.html">购物车</a></li>
                <li><a href="orders.html">我的订单</a></li>
            </ul>
        </div>
    </nav>
    
    <div class="container">
        <h1>商品列表</h1>
        <div class="product-grid" id="productList"></div>
    </div>
    
    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) { window.location.href = 'login.html'; }
        
        function loadProducts() {
            fetch('http://localhost:8081/api/product/onsale')
                .then(r => r.json())
                .then(data => {
                    if (data.code === 200) {
                        document.getElementById('productList').innerHTML = data.data.map(p => `
                            <div class="product-card">
                                <div class="product-image">
                                    ${p.imageUrl ? `<img src="${p.imageUrl}" alt="${p.productName}" onerror="this.parentElement.innerHTML='<div class=\'no-image\'>暂无图片</div>'">` : '<div class="no-image">暂无图片</div>'}
                                </div>
                                <div class="product-info">
                                    <div class="product-name">${p.productName}</div>
                                    <div class="product-price">¥${p.price}</div>
                                    <button class="btn-buy" onclick="buyProduct(${p.productId}, '${p.productName}', ${p.price})">立即购买</button>
                                </div>
                            </div>
                        `).join('');
                    }
                });
        }
        
        function buyProduct(productId, productName, price) {
            const orderData = {
                userId: currentUser.userId,
                totalAmount: price,
                receiverName: currentUser.realName || currentUser.username,
                receiverPhone: currentUser.phone || '13800138000',
                receiverAddress: currentUser.address || '默认地址',
                remark: ''
            };
            
            fetch('http://localhost:8081/api/order/create', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(orderData)
            })
            .then(r => r.json())
            .then(data => {
                if (data.code === 200) {
                    alert('订单创建成功！订单号：' + data.data.orderNo);
                    window.location.href = 'orders.html';
                } else {
                    alert('订单创建失败');
                }
            });
        }
        
        loadProducts();
    </script>
</body>
</html>
