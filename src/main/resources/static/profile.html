<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 电商系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #f5f5f5; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 0; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; padding: 0 20px; }
        .logo { font-size: 24px; font-weight: bold; }
        .nav-menu { display: flex; gap: 30px; list-style: none; }
        .nav-menu a { color: white; text-decoration: none; }
        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .profile-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; }
        .btn-save { padding: 12px 30px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">电商平台</div>
            <ul class="nav-menu">
                <li><a href="index.html">首页</a></li>
                <li><a href="products.html">商品列表</a></li>
                <li><a href="orders.html">我的订单</a></li>
            </ul>
        </div>
    </nav>
    
    <div class="container">
        <div class="profile-card">
            <h1 style="margin-bottom:30px;">个人信息</h1>
            <form id="profileForm">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="username" disabled>
                </div>
                <div class="form-group">
                    <label>真实姓名</label>
                    <input type="text" id="realName">
                </div>
                <div class="form-group">
                    <label>手机号</label>
                    <input type="tel" id="phone">
                </div>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="email">
                </div>
                <div class="form-group">
                    <label>性别</label>
                    <select id="gender">
                        <option value="0">未知</option>
                        <option value="1">男</option>
                        <option value="2">女</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>收货地址</label>
                    <input type="text" id="address">
                </div>
                <button type="submit" class="btn-save">保存修改</button>
            </form>
        </div>
    </div>
    
    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) { window.location.href = 'login.html'; }
        
        // 填充表单
        document.getElementById('username').value = currentUser.username;
        document.getElementById('realName').value = currentUser.realName || '';
        document.getElementById('phone').value = currentUser.phone || '';
        document.getElementById('email').value = currentUser.email || '';
        document.getElementById('gender').value = currentUser.gender || 0;
        document.getElementById('address').value = currentUser.address || '';
        
        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const userData = {
                userId: currentUser.userId,
                realName: document.getElementById('realName').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                gender: parseInt(document.getElementById('gender').value),
                address: document.getElementById('address').value
            };
            
            fetch('http://localhost:8081/api/user/update', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(userData)
            })
            .then(r => r.json())
            .then(data => {
                if (data.code === 200) {
                    alert('更新成功！');
                    // 更新本地存储
                    currentUser.realName = userData.realName;
                    currentUser.phone = userData.phone;
                    currentUser.email = userData.email;
                    currentUser.gender = userData.gender;
                    currentUser.address = userData.address;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                } else {
                    alert(data.message);
                }
            });
        });
    </script>
</body>
</html>
